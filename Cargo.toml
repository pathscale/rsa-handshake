[package]
name = "rsa-handshake"
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Verify-only RSA for TLS 1.3: PSS for CertificateVerify, PKCS#1 v1.5 for certificate signatures. no_std, no alloc, no unsafe, no private keys"
repository = "https://github.com/pathscale/rsa-handshake"
readme = "README.md"
keywords = ["rsa", "pss", "tls", "signature", "no-std"]
categories = ["cryptography", "no-std"]
exclude = ["tests/data", "fuzz"]

[dependencies]
# Hashing only. Default features off: no std, no alloc.
sha2 = { version = "^0.11", default-features = false }

[dev-dependencies]
# Reads the vendored Wycheproof JSON. Test-only.
serde_json = "^1"
hex = "^0.4"
